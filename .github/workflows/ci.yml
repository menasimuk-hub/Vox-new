# Gates merge to main. Does not deploy — production is still git pull + ./deploy-vps.sh on the server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: voxbulk-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voxbulk-api/requirements.txt
      - name: WeasyPrint system libs
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q --tb=short

  dashboard:
    name: Dashboard lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard.voxbulk.com/dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard.voxbulk.com/dashboard-web/package-lock.json
      - run: npm ci
      - run: npm run test
      - name: ESLint (advisory — existing prettier/hooks debt is not a merge gate)
        run: npm run lint:ci
        continue-on-error: true

  admin:
    name: Admin build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin.voxbulk.com/adim-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin.voxbulk.com/adim-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
