# /www/server/panel/vhost/nginx/voxbulk.com.conf
# Public site = static SPA wwwroot (same pattern as dashboard).
# rsync: voxbulk.com/frontend/dist/client/ → /www/wwwroot/voxbulk.com
# One-time switch: sudo bash scripts/vps-install-public-static-nginx.sh
# /frontpage/* and crawler files are proxied to the API (Host: api.voxbulk.com).

server
{
    listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen [::]:80;
    server_name voxbulk.com www.voxbulk.com;
    index index.html;
    root /www/wwwroot/voxbulk.com;

    include /www/server/panel/vhost/nginx/well-known/voxbulk.com.conf;

    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    ssl_certificate    /www/server/panel/vhost/cert/voxbulk.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/voxbulk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    include /www/server/nginx/conf/voxbulk-csp-report-only.conf;
    error_page 497  https://$host$request_uri;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Microsoft Entra publisher domain (exact match avoids alias 301 redirects).
    # Deploy syncs the file to /www/wwwroot/voxbulk.com/.well-known/
    location = /.well-known/microsoft-identity-association.json {
        alias /www/wwwroot/voxbulk.com/.well-known/microsoft-identity-association.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        allow all;
    }

    # Other verification files (ACME, IndexNow key .txt lives at site root via rsync).
    location ^~ /.well-known/ {
        root /www/wwwroot/voxbulk.com;
        default_type application/json;
        allow all;
    }

    location = /robots.txt {
        proxy_pass http://voxbulk_api/frontpage/seo/robots-plain;
        proxy_http_version 1.1;
        proxy_set_header Host api.voxbulk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /sitemap.xml {
        proxy_pass http://voxbulk_api/frontpage/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host api.voxbulk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /news-sitemap.xml {
        proxy_pass http://voxbulk_api/frontpage/seo/news-sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host api.voxbulk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location ^~ /frontpage/ {
        proxy_pass http://voxbulk_api;
        proxy_http_version 1.1;
        proxy_set_header Host api.voxbulk.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|webp|svg)$ {
        expires 30d;
        access_log off;
    }

    location ~ .*\.(js|css|woff2?|ttf|eot)$ {
        expires 12h;
        access_log off;
    }

    access_log  /www/wwwlogs/voxbulk.com.log;
    error_log   /www/wwwlogs/voxbulk.com.error.log;
}
